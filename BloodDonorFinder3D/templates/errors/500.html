{% extends "base.html" %}

{% block title %}Server Error (500) | Blood Donor Finder{% endblock %}

{% block content %}
<div style="max-width: 550px; margin: 4rem auto; text-align: center;">
  <span style="font-size: 4rem; display: inline-block; margin-bottom: 1rem;">⚠️</span>
  <h1 style="font-size: 2.5rem; font-weight: 900; color: var(--dark); margin-bottom: 0.5rem;">
    500 - Internal Server Error
  </h1>
  <p style="color: var(--text-muted); font-size: 1.05rem; margin-bottom: 2rem;">
    An unexpected condition was encountered. The transaction has been rolled back safely. Please try again.
  </p>
  <a href="{{ url_for('main.index') }}" class="btn btn-primary">
    Return to Safety
  </a>
</div>
{% endblock %}
