{% extends "base.html" %}

{% block title %}Access Denied (403) | Blood Donor Finder{% endblock %}

{% block content %}
<div style="max-width: 550px; margin: 4rem auto; text-align: center;">
  <span style="font-size: 4rem; display: inline-block; margin-bottom: 1rem;">🚫</span>
  <h1 style="font-size: 2.5rem; font-weight: 900; color: var(--dark); margin-bottom: 0.5rem;">
    403 - Access Forbidden
  </h1>
  <p style="color: var(--text-muted); font-size: 1.05rem; margin-bottom: 2rem;">
    You do not have the required permissions or role accreditation to access this portal area.
  </p>
  <div style="display: flex; gap: 1rem; justify-content: center;">
    <a href="{{ url_for('main.index') }}" class="btn btn-primary">
      Return to Home
    </a>
    <a href="{{ url_for('auth.login') }}" class="btn btn-outline">
      Sign in with Different Account
    </a>
  </div>
</div>
{% endblock %}
