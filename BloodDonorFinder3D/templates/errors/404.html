{% extends "base.html" %}

{% block title %}Page Not Found (404) | Blood Donor Finder{% endblock %}

{% block content %}
<div style="max-width: 550px; margin: 4rem auto; text-align: center;">
  <span style="font-size: 4rem; display: inline-block; margin-bottom: 1rem;">🔍</span>
  <h1 style="font-size: 2.5rem; font-weight: 900; color: var(--dark); margin-bottom: 0.5rem;">
    404 - Page Not Found
  </h1>
  <p style="color: var(--text-muted); font-size: 1.05rem; margin-bottom: 2rem;">
    The page or medical record you requested could not be located. It may have been moved or removed.
  </p>
  <div style="display: flex; gap: 1rem; justify-content: center;">
    <a href="{{ url_for('main.index') }}" class="btn btn-primary">
      Return to Home
    </a>
    <a href="{{ url_for('main.find_donor') }}" class="btn btn-outline">
      Find Donors
    </a>
  </div>
</div>
{% endblock %}
