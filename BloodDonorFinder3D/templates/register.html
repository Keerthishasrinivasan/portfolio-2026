{% extends "base.html" %}

{% block title %}Register Account | Blood Donor Finder{% endblock %}

{% block content %}
<div style="max-width: 680px; margin: 2rem auto;">
  <div class="card" style="padding: 2.5rem 2rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <span class="blood-type-badge" style="width: 52px; height: 52px; font-size: 1.5rem; margin-bottom: 1rem;">
        📝
      </span>
      <h1 style="font-size: 1.85rem; font-weight: 800; color: var(--dark);">Create Your Account</h1>
      <p style="color: var(--text-muted); font-size: 0.95rem;">
        Join the network to donate blood or request emergency units
      </p>
    </div>

    <!-- Role Switch Tabs -->
    <div style="display: flex; gap: 1rem; margin-bottom: 2rem; border-bottom: 2px solid var(--border); padding-bottom: 0.5rem;">
      <button type="button" id="tabDonor" class="btn btn-block" style="background: var(--primary); color: white;" onclick="switchRole('donor')">
        🩸 Voluntary Donor
      </button>
      <button type="button" id="tabHospital" class="btn btn-block btn-outline" onclick="switchRole('hospital')">
        🏥 Hospital / Clinic
      </button>
    </div>

    <form method="POST" action="{{ url_for('auth.register') }}" id="registerForm">
      <input type="hidden" name="role" id="roleInput" value="{{ active_role or 'donor' }}">

      <!-- Common Fields -->
      <div class="form-group">
        <label for="name" class="form-label" id="nameLabel">Full Name *</label>
        <input type="text" id="name" name="name" class="form-control" placeholder="e.g. Sarah Jenkins" required>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label for="email" class="form-label">Email Address *</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="user@example.com" required>
        </div>
        <div class="form-group">
          <label for="phone" class="form-label">Phone Number *</label>
          <input type="tel" id="phone" name="phone" class="form-control" placeholder="+1-555-0199" required>
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label for="password" class="form-label">Password *</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Min. 6 characters" required>
        </div>
        <div class="form-group">
          <label for="confirm_password" class="form-label">Confirm Password *</label>
          <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="••••••••" required>
        </div>
      </div>

      <div class="form-group">
        <label for="city" class="form-label">City *</label>
        <input type="text" id="city" name="city" class="form-control" placeholder="e.g. Chicago" required>
      </div>

      <!-- Donor-Specific Fields -->
      <div id="donorFields">
        <div class="grid-3">
          <div class="form-group">
            <label for="blood_group" class="form-label">Blood Group *</label>
            <select id="blood_group" name="blood_group" class="form-control" style="font-weight: 700;">
              {% for bg in blood_groups %}
                <option value="{{ bg }}">{{ bg }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="form-group">
            <label for="age" class="form-label">Age</label>
            <input type="number" id="age" name="age" class="form-control" min="18" max="65" placeholder="e.g. 25">
          </div>
          <div class="form-group">
            <label for="gender" class="form-label">Gender</label>
            <select id="gender" name="gender" class="form-control">
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="last_donation_date" class="form-label">Last Donation Date (if applicable)</label>
          <input type="date" id="last_donation_date" name="last_donation_date" class="form-control">
        </div>
      </div>

      <!-- Hospital-Specific Fields -->
      <div id="hospitalFields" style="display: none;">
        <div class="form-group">
          <label for="hospital_name" class="form-label">Official Hospital Name *</label>
          <input type="text" id="hospital_name" name="hospital_name" class="form-control" placeholder="e.g. Mercy General Hospital">
        </div>
        <div class="form-group">
          <label for="contact_person" class="form-label">Contact Doctor / Officer *</label>
          <input type="text" id="contact_person" name="contact_person" class="form-control" placeholder="e.g. Dr. John Watson, Chief Medical Officer">
        </div>
      </div>

      <div class="form-group">
        <label for="address" class="form-label">Physical Address / Street</label>
        <textarea id="address" name="address" class="form-control" rows="2" placeholder="Street name, landmark, area"></textarea>
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="padding: 0.85rem; font-size: 1rem; margin-top: 1rem;">
        Complete Registration
      </button>
    </form>

    <div style="text-align: center; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border); font-size: 0.9rem; color: var(--text-muted);">
      Already have an account?
      <a href="{{ url_for('auth.login') }}" style="font-weight: 700; color: var(--primary);">
        Login here
      </a>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  function switchRole(role) {
    const roleInput = document.getElementById('roleInput');
    const tabDonor = document.getElementById('tabDonor');
    const tabHospital = document.getElementById('tabHospital');
    const donorFields = document.getElementById('donorFields');
    const hospitalFields = document.getElementById('hospitalFields');
    const nameLabel = document.getElementById('nameLabel');

    roleInput.value = role;

    if (role === 'donor') {
      tabDonor.style.background = 'var(--primary)';
      tabDonor.style.color = 'white';
      tabHospital.style.background = 'transparent';
      tabHospital.style.color = 'var(--dark)';
      donorFields.style.display = 'block';
      hospitalFields.style.display = 'none';
      nameLabel.textContent = 'Full Name *';
    } else {
      tabHospital.style.background = 'var(--secondary)';
      tabHospital.style.color = 'white';
      tabDonor.style.background = 'transparent';
      tabDonor.style.color = 'var(--dark)';
      donorFields.style.display = 'none';
      hospitalFields.style.display = 'block';
      nameLabel.textContent = 'Contact Person Name *';
    }
  }

  // Initialize selected role
  document.addEventListener('DOMContentLoaded', () => {
    switchRole('{{ active_role or "donor" }}');
  });
</script>
{% endblock %}
